
name: Build PoolOverlayStarter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PoolOverlayStarter.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -q PoolOverlayStarter.zip -d .
          test -f PoolOverlayStarter/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name:       - name: Set JVM target to 17
        run: |
          sed -i '/compileOptions {/a\        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17' PoolOverlayStarter/app/build.gradle Build debug APK
        run: gradle -p PoolOverlayStarter assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolOverlayStarter-debug
          path: PoolOverlayStarter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
